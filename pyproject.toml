[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "investment-research-2026"
version = "0.1.0"
description = "Independent, no-trading investment research and Italian tax-cost scenario explorer"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
data = ["yfinance>=0.2.50", "pandas>=2.0", "numpy>=1.26"]
test = ["pytest>=8"]

[project.scripts]
investresearch = "investresearch.cli:main"
investresearch-dashboard = "investresearch.dashboard:main"

[tool.setuptools.packages.find]
where=["src"]

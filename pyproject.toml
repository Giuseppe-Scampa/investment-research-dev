[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "investment-research-2026"
version = "0.1.0"
description = "Independent, no-trading investment research and Italian tax-cost scenario explorer"
requires-python = ">=3.10"
dependencies = ["defusedxml>=0.7.1,<1"]

[project.optional-dependencies]
data = ["yfinance>=0.2.50", "pandas>=2.0", "numpy>=1.26"]
test = ["pytest>=8", "exchange_calendars==4.13.1"]
historical = ["exchange_calendars==4.13.1"]

[project.scripts]
investresearch = "investresearch.cli:main"
investresearch-dashboard = "investresearch.dashboard:main"
investresearch-b = "investresearch.research_cli:main"

[tool.setuptools.packages.find]
where=["src"]

name: SEC 18-issuer coverage on pinned Block B commit
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/sec-expanded-cohort.yml
permissions:
  contents: read
concurrency:
  group: sec-expanded-cohort
  cancel-in-progress: false
jobs:
  sec-cohort:
    if: github.repository == 'Giuseppe-Scampa/investment-research-dev'
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - name: Checkout exact reviewed research implementation
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: 3cd59f47e65e440e59d849e1f5ccebee14038a1c
          persist-credentials: false
      - name: Require immutable, individually reviewed research commit
        run: test "$(git rev-parse HEAD)" = '3cd59f47e65e440e59d849e1f5ccebee14038a1c'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
      - name: Install code without paid data services
        run: python -m pip install -e .
      - name: SEC 18-issuer live fundamental evidence; at most 19 requests
        # The secret is passed to this one step only; never pip, checkout or setup-python.
        env:
          SEC_RESEARCH_CONTACT: ${{ secrets.SEC_RESEARCH_CONTACT }}
        run: |
          investresearch-b sec-pilot --live-confirm --cohort config/sec_cohort_example.json --cache "$RUNNER_TEMP/sec-evidence/raw" --output "$RUNNER_TEMP/sec-evidence/report"
          python - <<'PY'
          import json, os
          from pathlib import Path
          report=json.loads((Path(os.environ["RUNNER_TEMP"])/"sec-evidence/report/SEC_ANNUAL_RESEARCH.json").read_text())
          expected={"AAPL","MSFT","NVDA","AMZN","GOOGL","META","ORCL","CRM","AMD","JNJ","PFE","PG","KO","COST","CAT","V","MA","JPM"}
          rows=report["results"]
          assert report["selected_count"]==len(expected)==18, "Selected cohort differs from specification"
          assert len(rows)==18 and {r["ticker"] for r in rows}==expected, "SEC ticker coverage mismatch"
          annual=sum(r["status"]=="SEC_ANNUAL_EVIDENCE_AVAILABLE_NO_MARKET_RANK" for r in rows)
          comparable=sum(r["comparison_status"]=="COMPARABLE_SAME_SEC_FILING" for r in rows)
          assert report["annual_evidence_count"]==annual==18, "Missing annual statements; manual review required"
          assert report["comparable_prior_year_count"]==comparable==18, "Missing comparable prior-year evidence"
          assert report["stale_annual_count"]==0, "Outdated SEC filings"
          assert all(r.get("market_score") is None for r in rows), "Unexpected market score"
          # market_ranking_count is a static declaration, not evidence of a verified ranking.
          print("SEC LIVE COHORT",annual,"annual profiles; same-filing comparisons:",comparable)
          for row in rows:
              print(row["ticker"],row["status"],row["comparison_status"])
          PY
      - name: Upload ONLY public SEC-derived summary (never raw cache or contact)
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: SEC-cohort-18-derived-evidence
          path: ${{ runner.temp }}/sec-evidence/report/SEC_ANNUAL_RESEARCH.*
          retention-days: 7
          if-no-files-found: error

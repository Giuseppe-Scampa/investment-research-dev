# R-009 manual smoke: exact one opted-in provider call; NEVER scheduled.
# Execute only with operator-confirmed Free-tier/no-billing account.
# The fixture is entirely synthetic and safe for PUBLIC Actions artifacts.
name: R-009 Manual free-tier public AI check

on:
  workflow_dispatch:
    inputs:
      provider:
        description: 'One free-tier provider (no fallback)'
        type: choice
        required: true
        options:
          - gemini
          - groq
          - openrouter
      acknowledge_free_tier:
        description: 'I independently verified free tier/no billing and approve one public synthetic critique request'
        type: boolean
        required: true
        default: false

permissions:
  contents: read

jobs:
  public_synthetic_ai_smoke:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.acknowledge_free_tier == true }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
      - name: Install code, no paid AI client dependencies
        run: python -m pip install -e .
      - name: Exactly one free-tier public-only counteranalysis, no retry
        shell: bash
        env:
          PROVIDER: ${{ inputs.provider }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          set -euo pipefail
          case "$PROVIDER" in
            gemini) MODEL='gemini-2.5-flash-lite';;
            groq) MODEL='openai/gpt-oss-20b';;
            openrouter) MODEL='google/gemma-4-26b-a4b-it:free';;
            *) echo "::error::Unsupported provider"; exit 2;;
          esac
          investresearch-b ai-countercheck \
            --spec config/ai_public_review_example.json \
            --provider "$PROVIDER" --model "$MODEL" \
            --invoke-free-remote --acknowledge-free-tier --acknowledge-public-only \
            --output data/private/r009-synthetic-manual-output
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('data/private/r009-synthetic-manual-output/AI_COUNTERANALYSIS.json')
          r=json.loads(p.read_text())
          assert r["execution"]=="OPT_IN_FREE_TIER_REMOTE"
          assert r["api_billing_status"]=="FREE_TIER_OPERATOR_ACKNOWLEDGED_BILLING_NOT_ATTESTED"
          assert r["result_status"]=="AI_UNVERIFIED_COUNTERANALYSIS_HUMAN_REVIEW_REQUIRED"
          assert r["rank_or_tax_authorization"] is False
          assert len(r["counterarguments"])<=12
          print("R-009 one-request synthetic-only smoke PASS; not a billing or factual audit")
          PY
      - name: Upload fictional public research results only
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: r009-public-fictional-one-provider
          path: |
            data/private/r009-synthetic-manual-output/AI_COUNTERANALYSIS.json
            data/private/r009-synthetic-manual-output/AI_COUNTERANALYSIS.md
          if-no-files-found: error
          retention-days: 3
      - name: Disclaim model, billing and factual verification
        if: always()
        run: |
          echo 'R-009: ONLY fictional public issuer excerpts. Not a real-market data or trade run.' >> "$GITHUB_STEP_SUMMARY"
          echo 'API billing settings and Free tier were operator-acknowledged, NOT verified by this workflow.' >> "$GITHUB_STEP_SUMMARY"
          echo 'Provider model output remains publicly visible in the uploaded synthetic-only artifact.' >> "$GITHUB_STEP_SUMMARY"
          echo 'No auto retries/fallback; no broker, tax, prices, orders or private documents.' >> "$GITHUB_STEP_SUMMARY"

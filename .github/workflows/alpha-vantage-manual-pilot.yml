name: Alpha Vantage - manual free daily pilot (no market artifacts)

# Security boundary: this thin manual-only workflow lives on main.
# It checks out one audited, immutable commit from the draft V3 branch.
# Never use a moving branch ref with an API key. No push/PR triggers.
on:
  workflow_dispatch:
    inputs:
      instrument:
        description: "One symbol only; diagnostic RAW daily data, never trade-ready"
        required: true
        type: choice
        default: FSLR
        options:
          - FSLR
          - IBM

permissions:
  contents: read

concurrency:
  group: alpha-vantage-free-manual-pilot
  cancel-in-progress: false

jobs:
  source-diagnostic:
    if: github.repository == 'Giuseppe-Scampa/investment-research-dev' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Checkout audited pilot version - immutable commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: 688968dfd754c1d52e1f70296e665b7fc0d0f040
          persist-credentials: false
          fetch-depth: 1
      - name: Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
      - name: Install code (no model, broker or paid provider)
        run: python -m pip install -e .
      - name: One explicit provider request, no CSV artifact
        shell: bash
        env:
          ALPHAVANTAGE_API_KEY: ${{ secrets.ALPHAVANTAGE_API_KEY }}
          PILOT_INSTRUMENT: ${{ inputs.instrument }}
        run: |
          set -euo pipefail
          umask 077
          if [[ -z "${ALPHAVANTAGE_API_KEY:-}" ]]; then
            echo "::error::Repository secret ALPHAVANTAGE_API_KEY is missing or empty"
            exit 2
          fi
          case "$PILOT_INSTRUMENT" in
            FSLR) MIC="XNAS";;
            IBM) MIC="XNYS";;
            *)
              echo "::error::Only reviewed FSLR or IBM are allowed for this diagnostic"
              exit 2
              ;;
          esac
          python -m investresearch.research_cli alpha-pilot \
            --symbol "$PILOT_INSTRUMENT" \
            --venue "$MIC" \
            --live-confirm \
            --acknowledge-source-terms \
            --output "$RUNNER_TEMP/alpha_vantage_single_symbol"
          # Deliberately do not print the URL (would include API key),
          # raw CSV, prices, full error traces, or source payload.
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          p=Path(os.environ["RUNNER_TEMP"]) / "alpha_vantage_single_symbol" / "ALPHA_PILOT_METADATA.json"
          data=json.loads(p.read_text(encoding="utf-8"))
          if data["research_status"] != "NOT_TRADE_READY_NOT_ELIGIBLE_FOR_GLOBAL_FUNNEL":
              raise SystemExit("Unexpected research readiness label")
          lines=[
              "## Alpha Vantage RAW daily — isolated manual diagnostic",
              "",
              "| Field | Evidence |",
              "|---|---|",
          ]
          for label,key in [
              ("Symbol", "symbol"),
              ("Source", "source_endpoint_no_key"),
              ("Session count", "session_count"),
              ("First session", "oldest_session"),
              ("Last session", "latest_session"),
              ("Retrieved at UTC", "retrieved_at_utc"),
              ("Raw SHA256", "raw_payload_sha256"),
              ("Normalized SHA256", "normalized_csv_sha256"),
              ("Readiness", "research_status"),
              ("Price basis", "price_basis"),
              ("License", "license"),
          ]:
              value=str(data[key])
              if any(c in value for c in "|\r\n"):
                  raise SystemExit("Unsafe summary field")
              lines.append(f"| {label} | {value} |")
          lines += [
              "",
              "**No adjusted prices, corporate-action validation, ISIN verification,",
              "free-tier licensing conclusion or trading recommendation.**",
              "Only the temporary runner has the raw prices; no artifact is uploaded.",
          ]
          with open(os.environ["GITHUB_STEP_SUMMARY"],"a",encoding="utf-8") as f:
              f.write("\n".join(lines)+"\n")
          print("PILOT PASS: schema/collection and local integrity checks; NOT trade-ready")
          PY
      - name: Ensure no market price artifacts were staged
        if: always()
        shell: bash
        run: |
          test ! -e reports/generated/alpha_vantage_daily.csv
          test ! -e reports/generated/ALPHA_DAILY_UNVERIFIED.csv
          echo "No market-data artifacts are published by this workflow."

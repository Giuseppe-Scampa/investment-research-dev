name: CI tests and offline reproducible report
on:
  push:
  pull_request:
    types: [opened, synchronize, reopened, edited]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
      - run: python -m pip install -e '.[test,historical]'
      - run: pytest -q
      - name: Frozen historical falsification — winning and losing synthetic regimes
        run: |
          python - <<'PY'
          import runpy, tempfile
          from pathlib import Path
          from investresearch.research_historical_validation import validate_historical
          fake=runpy.run_path("tests/test_r007_historical_validation.py")["fake_bundle"]
          with tempfile.TemporaryDirectory(prefix="fictional_backtest_") as folder:
              root=Path(folder)
              positive=root/"mixed";positive.mkdir()
              negative=root/"adversarial";negative.mkdir()
              a=validate_historical(fake(positive))
              b=validate_historical(fake(negative,regime="adversarial_reversal"))
              assert a["random_portfolio_trials"]==10000
              assert b["random_portfolio_trials"]==10000
              assert any(f["excess_vs_universe"]<0 for f in b["folds"])
              assert a["status"]==b["status"]=="SYNTHETIC_NOT_MARKET_EVIDENCE"
              assert not a["predictive_edge_certified"] and not b["predictive_edge_certified"]
              print("PREREGISTERED PROTOCOL:",a["protocol_sha256"])
              print("SYNTHETIC ordinary regime: folds",a["folds_evaluable"],
                    "mean excess",a["mean_excess_vs_equal_universe"],
                    "IC",a["mean_IC_spearman"],"random percentile",a["random_portfolio_percentile"])
              print("SYNTHETIC adversarial reversal: folds",b["folds_evaluable"],
                    "mean excess",b["mean_excess_vs_equal_universe"],
                    "IC",b["mean_IC_spearman"],"random percentile",b["random_portfolio_percentile"])
              print("NO AUTHENTIC PRICE DATA; NO OOS PREDICTIVE CLAIM; NO BANK TAX CERTIFICATION")
          PY
      - name: R-011/R-012 public privacy and immutable-baseline gate
        run: python tools/verify_v3_release_boundary.py
      - name: Require architecture and requirement references in PR
        if: github.event_name == 'pull_request'
        run: python tools/check_architecture_pr.py
      - run: python -m compileall -q src tests
      - run: investresearch report
      - run: python -m investresearch.dashboard
      - name: Verify Block A artifacts
        run: |
          test -s reports/generated/DECISION_COMPARISON.md
          test -s reports/generated/decision_comparison.json
          test -s reports/generated/decision_ledger.json
          test -s reports/generated/dashboard.html
      - name: Offline Block B research (synthetic dataset only)
        run: investresearch-b screen --bundle data/research/demo --output reports/generated/block_b
      - name: Decision 2026 tactical mode — synthetic demo must produce no actual candidates
        run: |
          investresearch-b tactical --bundle data/research/demo --output reports/generated/block_b_tactical_demo
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('reports/generated/block_b_tactical_demo/TACTICAL_RESEARCH.json')
          r=json.loads(p.read_text())
          assert r['dataset_mode']=='SYNTHETIC_DEMONSTRATION_NOT_MARKET_DATA'
          assert r['status']=='SYNTHETIC_DIAGNOSTIC_NO_INVESTMENT_QUEUE'
          assert r['final_investment_shortlist']==[]
          assert r['research_priorities_by_type']==[]
          assert r['trade_ready'] is False
          print('PASS: Decision 2026 demo refuses to fabricate investment shortlist')
          PY
      - name: Verify Block B deterministic artifacts
        run: |
          test -s reports/generated/block_b/BLOCK_B_SCREENING.json
          test -s reports/generated/block_b/BLOCK_B_SCREENING.csv
          test -s reports/generated/block_b/BLOCK_B_SCREENING.md
          test -s reports/generated/block_b/block_b_dashboard.html
      - name: Reject downloaded raw market-data payloads
        run: |
          test ! -e reports/generated/provider_history_unverified.csv
          test ! -d reports/generated/raw_prices
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: offline-analysis-synthetic-only
          path: |
            reports/generated/REPORT.md
            reports/generated/DECISION_COMPARISON.md
            reports/generated/decision_comparison.json
            reports/generated/dashboard.html
            reports/generated/quality_gates.json
            reports/generated/screening.csv
            reports/generated/portfolio_scenarios.csv
            reports/generated/GITHUB_SUMMARY.md
            reports/generated/block_b/BLOCK_B_SCREENING.json
            reports/generated/block_b/BLOCK_B_SCREENING.csv
            reports/generated/block_b/BLOCK_B_SCREENING.md
            reports/generated/block_b/block_b_dashboard.html
            reports/generated/block_b_tactical_demo/TACTICAL_RESEARCH.json
            reports/generated/block_b_tactical_demo/TACTICAL_RESEARCH.md
          retention-days: 14
          if-no-files-found: error

  live_research_sp500_source_probe:
    # Real multi-year equity prices, third-party research & education only.
    # WARNING survivorship bias: source contains today's S&P500 stocks.
    # Original 80+ MB CSV is read into ephemeral memory and NEVER uploaded.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 4
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
      - name: Acquire genuine public research/education S&P 500 CSV and validate aggregate evidence
        run: python tools/probe_public_research_sp500_history.py
      - name: Explicit source limitations and no raw security distribution
        if: always()
        run: |
          echo 'Secondary actual market-data source: research/education use only; no original stock prices published.' >> "$GITHUB_STEP_SUMMARY"
          echo 'Current S&P500 membership means SURVIVORSHIP BIAS: not historical point-in-time cohort.' >> "$GITHUB_STEP_SUMMARY"
          echo 'Adjusted price columns are vendor assertions, not issuer corporate-action certification.' >> "$GITHUB_STEP_SUMMARY"

  live_original_xetra_pds_hist_probe:
    # Real dated 2018/2019 original public source, NONCOMMERCIAL licence.
    # The archived dataset is deprecated. No raw prices or S3 objects stored
    # as actions artifacts; 2018/2019 minute prices are NOT adjusted EOD.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
      - name: Acquire one authentic Deutsche Boerse Xetra old minute CSV (aggregate audit only)
        run: python tools/probe_public_xetra_pds_historical.py
      - name: Explicit non-trading and data-rights scope
        if: always()
        run: |
          echo 'Original Xetra PDS historical minute source: noncommercial and deprecated.' >> "$GITHUB_STEP_SUMMARY"
          echo 'Only aggregated counts/hash may appear in logs; no raw prices or instrument shortlist.' >> "$GITHUB_STEP_SUMMARY"
          echo 'This live probe does not validate adjusted historical returns or any trading signal.' >> "$GITHUB_STEP_SUMMARY"

  live_ecb_smoke:
    # Independent public-source compatibility check, not a financial-data
    # verification certificate. Network outages must not invalidate offline CI.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 4
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
      - run: python -m pip install -e .
      - name: ECB official XML live HTTP and parser smoke (best effort)
        continue-on-error: true
        run: python tools/smoke_ecb.py
      - name: Scope disclaimer
        run: echo 'SEC requires a manual source probe with its configured contact secret; Yahoo/yfinance is opt-in only, never an automatic CI feed.'

  live_esef_smoke:
    # Official 2025 Edison iXBRL download, without secrets or raw-data uploads.
    # A received invalid issuer file FAILS this job; only source unavailability is nonblocking.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
      - run: python -m pip install -e .
      - name: Audit official Edison ESEF — fail on validation, allow network outage
        id: esef
        shell: bash
        run: |
          set +e
          python tools/smoke_edison_esef.py > "$RUNNER_TEMP/edison-esef-probe.log" 2>&1
          rc=$?
          set -e
          cat "$RUNNER_TEMP/edison-esef-probe.log"
          if [ "$rc" -eq 0 ]; then
            echo "classification=NUMERIC_RECONCILIATION_PASSED_REVIEW_REQUIRED" >> "$GITHUB_OUTPUT"
          elif [ "$rc" -eq 1 ] && grep -Fq 'LIVE ESEF SOURCE_UNAVAILABLE:' "$RUNNER_TEMP/edison-esef-probe.log"; then
            echo "classification=SOURCE_UNAVAILABLE_NO_VALIDATION" >> "$GITHUB_OUTPUT"
            echo "::warning::Edison ESEF source unavailable; numeric validation NOT performed"
          else
            echo "classification=VALIDATION_FAILED" >> "$GITHUB_OUTPUT"
            echo "::error::Edison ESEF parser, integrity or numeric reference validation failed"
            exit 2
          fi
      - name: Report explicit Edison validation classification (no issuer artifacts)
        if: always()
        env:
          CLASSIFICATION: ${{ steps.esef.outputs.classification }}
        run: |
          echo "Edison ESEF: ${CLASSIFICATION:-NO_RESULT_STEP_FAILED}" >> "$GITHUB_STEP_SUMMARY"
          echo "Successful numeric reconciliation remains provisional and requires manual audit." >> "$GITHUB_STEP_SUMMARY"
          echo "No issuer ZIP/XHTML or provider prices uploaded." >> "$GITHUB_STEP_SUMMARY"

  live_prysmian_esef_smoke:
    # Additional independent FY2025 issuer. Its outcome is diagnostic, not an
    # investment-data validation. No secret, provider ZIP or pricing CSV upload.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 7
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
      - run: python -m pip install -e .
      - name: Audit official Prysmian ESEF — fail on validation, allow network outage
        id: prysmian
        shell: bash
        run: |
          set +e
          python tools/smoke_prysmian_esef.py > "$RUNNER_TEMP/prysmian-esef-probe.log" 2>&1
          rc=$?
          set -e
          cat "$RUNNER_TEMP/prysmian-esef-probe.log"
          if [ "$rc" -eq 0 ]; then
            echo "classification=NUMERIC_RECONCILIATION_PASSED_REVIEW_REQUIRED" >> "$GITHUB_OUTPUT"
          elif [ "$rc" -eq 1 ] && grep -Fq 'PRYSMIAN LIVE ESEF SOURCE_UNAVAILABLE:' "$RUNNER_TEMP/prysmian-esef-probe.log"; then
            echo "classification=SOURCE_UNAVAILABLE_NO_VALIDATION" >> "$GITHUB_OUTPUT"
            echo "::warning::Prysmian ESEF source unavailable; numeric validation NOT performed"
          else
            echo "classification=VALIDATION_FAILED" >> "$GITHUB_OUTPUT"
            echo "::error::Prysmian ESEF parser, integrity or numeric reference validation failed"
            exit 2
          fi
      - name: Publish explicit Prysmian classification (no raw issuer artifacts)
        if: always()
        env:
          CLASSIFICATION: ${{ steps.prysmian.outputs.classification }}
        run: |
          echo "Prysmian ESEF: ${CLASSIFICATION:-NO_RESULT_STEP_FAILED}" >> "$GITHUB_STEP_SUMMARY"
          echo "Numeric reconciliation is not a full ESEF taxonomy or audit certificate." >> "$GITHUB_STEP_SUMMARY"
          echo "No issuer ZIP/XHTML or provider prices uploaded." >> "$GITHUB_STEP_SUMMARY"

  live_xetra_reference_smoke:
    # Opt-in public production-reference CSV on explicit workflow_dispatch only;
    # no API secrets, prices, vendor artifacts or IDs published.
    # Avoid repeated external downloads on every PR push.
    # A received malformed file fails CI; network unavailability is explicit.
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 4
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
      - run: python -m pip install -e .
      - name: Verify live official Xetra T7 reference schema and aggregate counts
        id: xetra
        shell: bash
        run: |
          set +e
          python tools/smoke_xetra_reference.py > "$RUNNER_TEMP/xetra-reference-smoke.log" 2>&1
          rc=$?
          set -e
          cat "$RUNNER_TEMP/xetra-reference-smoke.log"
          if [ "$rc" -eq 0 ] && grep -Fq 'XETRA_REFERENCE_CLASSIFICATION=DISCOVERY_REFERENCE_VALIDATED' "$RUNNER_TEMP/xetra-reference-smoke.log"; then
            echo "classification=DISCOVERY_REFERENCE_VALIDATED_UNRANKED" >> "$GITHUB_OUTPUT"
          elif [ "$rc" -eq 1 ] && grep -Fq 'XETRA_REFERENCE_CLASSIFICATION=SOURCE_UNAVAILABLE' "$RUNNER_TEMP/xetra-reference-smoke.log"; then
            echo "classification=SOURCE_UNAVAILABLE_NOT_VALIDATED" >> "$GITHUB_OUTPUT"
            echo "::warning::Official Xetra CSV unavailable; no real discovery intake validated"
          else
            echo "classification=VALIDATION_FAILED" >> "$GITHUB_OUTPUT"
            echo "::error::Xetra reference payload received but failed strict validation"
            exit 2
          fi
      - name: Explicit reference-data scope and no vendor artifacts
        if: always()
        env:
          CLASSIFICATION: ${{ steps.xetra.outputs.classification }}
        run: |
          echo "Official Xetra reference: ${CLASSIFICATION:-NO_VALIDATED_RESULT}" >> "$GITHUB_STEP_SUMMARY"
          echo "Only instrument discovery, no 61-session prices, ISIN tax review, source-use licence or investment ranking." >> "$GITHUB_STEP_SUMMARY"
          echo "Vendor CSV kept solely in ephemeral process memory; no raw data artifact uploads." >> "$GITHUB_STEP_SUMMARY"


  live_eodhd_evaluation_smoke:
    # Explicit opt-in workflow_dispatch only, after successful live pilot.
    # Avoid repeated vendor traffic on each PR push. Public DEMO key only.
    # Fetch 3 allowlisted JSON endpoints; keep ALL returned vendor data
    # ephemeral, never upload provider data, identifiers, quotes or artifacts.
    # After the first validated run, switch this to opt-in dispatch only.
    if: false # EODHD excluded by operator, no paid/free EODHD dependency
    runs-on: ubuntu-latest
    timeout-minutes: 4
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
      - name: Install parser, no API keys or data providers
        run: python -m pip install -e .
      - name: One bounded live EODHD provider DEMO parser and actions probe
        run: python tools/smoke_eodhd_demo.py
      - name: Demo is evaluation-only, never a scored dataset
        if: always()
        run: |
          echo 'EODHD demo: source/schema quality probe only; 0 securities recommended.' >> "$GITHUB_STEP_SUMMARY"
          echo 'No raw OHLCV/splits/dividends, API tokens or vendor data artifacts published.' >> "$GITHUB_STEP_SUMMARY"
          echo 'Source rights, splits/dividends cross-provider verification, FX and ISIN/venue remain required.' >> "$GITHUB_STEP_SUMMARY"

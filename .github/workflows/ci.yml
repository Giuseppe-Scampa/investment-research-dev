name: CI tests and offline reproducible report
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
      - run: python -m pip install -e '.[test]'
      - run: pytest -q
      - run: python -m compileall -q src tests
      - run: investresearch report
      - run: python -m investresearch.dashboard
      - name: Verify Block A artifacts
        run: |
          test -s reports/generated/DECISION_COMPARISON.md
          test -s reports/generated/decision_comparison.json
          test -s reports/generated/decision_ledger.json
          test -s reports/generated/dashboard.html
      - name: Reject downloaded raw market-data payloads
        run: |
          test ! -e reports/generated/provider_history_unverified.csv
          test ! -d reports/generated/raw_prices
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: offline-analysis-synthetic-only
          path: |
            reports/generated/REPORT.md
            reports/generated/DECISION_COMPARISON.md
            reports/generated/decision_comparison.json
            reports/generated/dashboard.html
            reports/generated/quality_gates.json
            reports/generated/screening.csv
            reports/generated/portfolio_scenarios.csv
            reports/generated/GITHUB_SUMMARY.md
          retention-days: 14
          if-no-files-found: error

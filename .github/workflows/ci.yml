name: CI tests and offline reproducible report
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e '.[test]'
      - run: pytest -q
      - run: python -m compileall -q src tests
      - run: investresearch report
      - run: python -m investresearch.dashboard
      - name: Verify Block A artifacts
        run: |
          test -s reports/generated/DECISION_COMPARISON.md
          test -s reports/generated/decision_comparison.json
          test -s reports/generated/decision_ledger.json
          test -s reports/generated/dashboard.html
      - name: Offline Block B research (synthetic dataset only)
        run: investresearch-b screen --bundle data/research/demo --output reports/generated/block_b
      - name: Verify Block B deterministic artifacts
        run: |
          test -s reports/generated/block_b/BLOCK_B_SCREENING.json
          test -s reports/generated/block_b/BLOCK_B_SCREENING.csv
          test -s reports/generated/block_b/BLOCK_B_SCREENING.md
          test -s reports/generated/block_b/block_b_dashboard.html
      - uses: actions/upload-artifact@v4
        with:
          name: offline-analysis
          path: reports/generated/
          retention-days: 14

  live_ecb_smoke:
    # Independent public-source compatibility check, not a financial-data
    # verification certificate. Network outages must not invalidate offline CI.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 4
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e .
      - name: ECB official XML live HTTP and parser smoke (best effort)
        continue-on-error: true
        run: python tools/smoke_ecb.py
      - name: Scope disclaimer
        run: echo 'SEC requires a manual source probe with its configured contact secret; Yahoo/yfinance is opt-in only, never an automatic CI feed.'

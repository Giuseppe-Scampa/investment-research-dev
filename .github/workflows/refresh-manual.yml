name: Manual non-executable historical refresh
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  manual-refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e '.[data]'
      - run: investresearch refresh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: provider-history-unverified
          path: reports/generated/
          retention-days: 7

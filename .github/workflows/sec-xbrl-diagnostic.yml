name: SEC XBRL concept diagnostics (CAT and MA)
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [.github/workflows/sec-xbrl-diagnostic.yml]
permissions:
  contents: read
jobs:
  official-sec-tags:
    if: github.repository == 'Giuseppe-Scampa/investment-research-dev'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      SEC_RESEARCH_CONTACT: ${{ secrets.SEC_RESEARCH_CONTACT }}
    steps:
      - name: Public XBRL tag coverage, no raw data/secret output
        shell: bash
        run: |
          python - <<'PY'
          import os,re,json,time
          from datetime import date
          from urllib.request import Request,urlopen
          contact=os.environ.get('SEC_RESEARCH_CONTACT','')
          if not re.fullmatch(r'[^\\s@]+@[^\\s@]+\\.[^\\s@]+',contact):
              raise SystemExit('SEC contact missing')
          for ticker,cik in [('CAT','0000018230'),('MA','0001141391')]:
              req=Request('https://data.sec.gov/api/xbrl/companyfacts/CIK'+cik+'.json',headers={
                  'User-Agent':'InvestmentResearchDev/0.4 research '+contact,
                  'Accept':'application/json'})
              with urlopen(req,timeout=30) as resp:data=json.load(resp)
              if str(data.get('cik'))!=str(int(cik)):raise ValueError('Wrong CIK')
              matched=[]
              for tag,concept in data.get('facts',{}).get('us-gaap',{}).items():
                  if not re.search(r'Revenue|Sales|NetIncome|ProfitLoss|Earnings',tag,re.I):continue
                  period=set()
                  for item in concept.get('units',{}).get('USD',[]):
                      if item.get('form') not in ('10-K','10-K/A') or item.get('fp')!='FY':continue
                      try:
                          start=date.fromisoformat(item['start']);end=date.fromisoformat(item['end'])
                          filed=date.fromisoformat(item['filed'])
                      except (KeyError,ValueError):continue
                      if 300<=(end-start).days<=390 and filed<=date.today() and end.year>=2024:
                          period.add(end.isoformat())
                  if period:matched.append((tag,max(period)))
              print('ISSUER',ticker,'RECENT_CONCEPTS',len(matched))
              for tag,end in sorted(matched)[:65]:print(ticker,end,tag)
              time.sleep(1.3)
          PY

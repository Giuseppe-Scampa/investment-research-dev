name: Manual offline analysis (no paid API)
on:
  workflow_dispatch:
    inputs:
      refresh_history:
        description: 'Optional yfinance UNVERIFIED historical data; requires additional free data dependency'
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: financial-research-manual
  cancel-in-progress: false
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install test + optional free data support
        run: python -m pip install -e '.[test,data]'
      - name: Tests
        run: python -m pytest -q
      - name: Optional external UNVERIFIED history
        if: ${{ inputs.refresh_history }}
        run: investresearch refresh
      - name: Generate offline report
        run: investresearch report
      - name: Render dashboard
        run: python -m investresearch.dashboard
      - name: Job summary
        run: cat reports/generated/GITHUB_SUMMARY.md >> "$GITHUB_STEP_SUMMARY"
      - name: Upload synthetic-only reports
        uses: actions/upload-artifact@v4
        with:
          name: offline-synthetic-report
          path: reports/generated/
          retention-days: 7
          if-no-files-found: error

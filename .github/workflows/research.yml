name: Manual offline analysis (synthetic-only; no market downloads)
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: financial-research-manual
  cancel-in-progress: false
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
      - name: Install offline-only dependencies
        run: python -m pip install -e '.[test]'
      - name: Tests
        run: python -m pytest -q
      - name: Generate offline report
        run: investresearch report
      - name: Render dashboard
        run: python -m investresearch.dashboard
      - name: Job summary
        run: cat reports/generated/GITHUB_SUMMARY.md >> "$GITHUB_STEP_SUMMARY"
      - name: Verify public workflow cannot package downloaded prices
        run: |
          test ! -e reports/generated/provider_history_unverified.csv
          test ! -d reports/generated/raw_prices
      - name: Upload explicit synthetic-report allowlist (never raw market history)
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: offline-synthetic-report
          path: |
            reports/generated/REPORT.md
            reports/generated/DECISION_COMPARISON.md
            reports/generated/decision_comparison.json
            reports/generated/dashboard.html
            reports/generated/GITHUB_SUMMARY.md
            reports/generated/quality_gates.json
            reports/generated/screening.csv
            reports/generated/portfolio_scenarios.csv
          retention-days: 7
          if-no-files-found: error
